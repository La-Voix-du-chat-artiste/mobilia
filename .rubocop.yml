inherit_from:
  - .rubocop-custom.yml
  - .rubocop-disabled.yml
  - .rubocop_todo.yml

# `require:` is deprecated for extensions since RuboCop 1.72.
plugins:
  - rubocop-performance
  - rubocop-rails

AllCops:
  SuggestExtensions: false
  Exclude:
    - 'db/schema.rb'
    - 'vendor/**/*'
    - 'tmp/**/*'

Rails/I18nLocaleTexts:
  Enabled: false
